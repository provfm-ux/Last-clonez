name: Agent task
description: A small, well-scoped task for a coding agent (Copilot, Claude, Codex...)
title: "[task] "
labels: ["agent-task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal (what the player should notice)
      placeholder: "When X happens, Y. Dark tone, English text."
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [story, world/regions, items & crafting, survival & health, combat & infected, graphics, ui & touch, performance, tests & tooling]
    validations: { required: true }
  - type: textarea
    id: files
    attributes:
      label: Files likely touched (from docs/CONTENT_GUIDE.md)
      placeholder: "game/data.js, tests/smoke-test.js"
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: "- [ ] `npm test` passes\n- [ ] `npm run index:check` passes\n- [ ] New test added\n- [ ] CHANGELOG line added"
